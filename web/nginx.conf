server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same origin for the browser: nginx forwards API calls to the api container (no CORS needed).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass http://api:8080/health;
  }

  # Client-side routes (/books/1, /cart, /orders/...) all serve the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
