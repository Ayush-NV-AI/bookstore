# CI for the Book Store. Note: the Gemini Code Assist review agent does NOT review or suggest changes for files
# under .github/workflows/ — changes to this file get human review only.
name: ci

on:
  pull_request:
    branches: [main, capstone/integration]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: API tests (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --nologo

  frontend:
    name: Web build (strict TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build

  e2e:
    name: UI tests (Playwright, real PostgreSQL)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: bookstore
          POSTGRES_PASSWORD: bookstore_local_dev
          POSTGRES_DB: bookstore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bookstore -d bookstore"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report

  constitution-gate:
    name: Constitution gate (Gemini CLI, headless)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation — no long-lived keys in GitHub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare gate input (constitution + PR diff)
        run: node scripts/ci/constitution-gate.mjs --prepare-only --base "origin/${{ github.base_ref }}"

      - name: Review with Gemini CLI
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          gcp_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          gcp_location: ${{ vars.GOOGLE_CLOUD_LOCATION }}
          use_gemini_code_assist: 'true'
          settings: |
            { "tools": { "core": ["read_file"] } }
          prompt: |
            Read the file gate-input.md with read_file. Act as the merge gate described in its final section.
            Answer with the JSON object only.

      - name: Gate on the verdict
        env:
          GATE_RESPONSE: ${{ steps.gemini.outputs.summary }}
        run: |
          printf '%s' "$GATE_RESPONSE" > gate-response.txt
          node scripts/ci/constitution-gate.mjs --evaluate gate-response.txt
          status=$?
          cat gate-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
        shell: bash {0}
