services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookstore
      # Local-only development password (Constitution VI exception). Never reuse outside this container.
      POSTGRES_PASSWORD: bookstore_local_dev
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
